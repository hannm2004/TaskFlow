services:

  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: taskflow_root
      MYSQL_DATABASE: taskflow_db

    ports:
      - "3306:3306"

    volumes:
      - taskflow_mysql_data:/var/lib/mysql

volumes:
  taskflow_mysql_data: